services:
  - type: web
    name: research-summarizer
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: OLLAMA_BASE_URL
        value: https://ollama.com/v1
      - key: OLLAMA_API_KEY
        sync: false
    healthCheckPath: /
    autoDeploy: true
